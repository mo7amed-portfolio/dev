<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Developer Panel — Mohamed Ashraf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
        --bg: #0B0E14;
        --bg-2: #0E1220;
        --glass: rgba(255, 255, 255, 0.045);
        --glass-strong: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-border-strong: rgba(255, 255, 255, 0.2);
        --text: #F5F7FA;
        --text-dim: #9AA3B5;
        --text-faint: #6B7385;
        --accent-1: #5B8CFF;
        --accent-2: #9D6BFF;
        --accent-3: #34D399;
        --danger: #F87171;
        --grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 12px;
        --font-ar: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
        --font-en: 'Space Grotesk', 'Inter', sans-serif;
        --transition: 0.25s ease;
    }
    body {
        background: var(--bg);
        background-image:
            radial-gradient(circle at 15% 10%, rgba(91, 140, 255, 0.10), transparent 45%),
            radial-gradient(circle at 85% 90%, rgba(157, 107, 255, 0.10), transparent 45%);
        font-family: var(--font-en);
        color: var(--text);
    }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-card {
        width: 100%;
        max-width: 360px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        padding: 32px 26px;
        backdrop-filter: blur(14px);
    }
    .login-card h1 {
        font-size: 20px;
        margin-bottom: 4px;
    }
    .login-card p {
        color: var(--text-dim);
        font-size: 13px;
        margin-bottom: 22px;
    }
    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 12.5px;
        color: var(--text-dim);
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        padding: 10px 13px;
        border-radius: var(--radius-sm);
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
    }
    .field input:focus { border-color: var(--glass-border-strong); }
    .login-btn {
        width: 100%;
        padding: 11px;
        border-radius: var(--radius-sm);
        border: none;
        background: var(--grad);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        transition: transform var(--transition);
    }
    .login-btn:hover { transform: translateY(-1px); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .login-error {
        color: var(--danger);
        font-size: 12.5px;
        margin-top: 10px;
        display: none;
    }

    /* ===== APP SHELL ===== */
    #appShell { display: none; height: 100vh; }
    .panel-wrap {
        display: flex;
        height: 100%;
    }

    .sidebar {
        width: 320px;
        flex-shrink: 0;
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        background: rgba(11, 14, 20, 0.5);
    }
    .sidebar-header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .sidebar-header h2 { font-size: 15px; font-weight: 600; }
    .logout-btn {
        background: none;
        border: 1px solid var(--glass-border);
        color: var(--text-dim);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 11.5px;
        cursor: pointer;
        font-family: inherit;
    }
    .logout-btn:hover { color: var(--text); border-color: var(--glass-border-strong); }

    .order-list {
        flex: 1;
        overflow-y: auto;
    }
    .order-item {
        padding: 13px 18px;
        border-bottom: 1px solid var(--glass-border);
        cursor: pointer;
        transition: background var(--transition);
    }
    .order-item:hover { background: var(--glass); }
    .order-item.active { background: var(--glass-strong); }
    .order-item-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }
    .order-item-name { font-weight: 600; font-size: 14px; }
    .order-item-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 999px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    .order-item-badge.new { background: rgba(52, 211, 153, 0.15); color: var(--accent-3); }
    .order-item-badge.in_progress { background: rgba(91, 140, 255, 0.15); color: var(--accent-1); }
    .order-item-badge.done { background: var(--glass-strong); color: var(--text-faint); }
    .order-item-sub {
        font-size: 12px;
        color: var(--text-dim);
    }
    .empty-orders {
        padding: 30px 18px;
        color: var(--text-faint);
        font-size: 13px;
        text-align: center;
    }

    /* ===== CHAT AREA ===== */
    .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .chat-placeholder {
        margin: auto;
        text-align: center;
        color: var(--text-faint);
        font-size: 13.5px;
        padding: 20px;
    }

    .chat-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }
    .chat-header .cust-name { font-weight: 600; font-size: 15px; }
    .chat-header .cust-meta { font-size: 12px; color: var(--text-dim); }
    .status-select {
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        color: var(--text);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-family: inherit;
    }

    .order-details-banner {
        margin: 10px 20px 0;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        font-size: 12.5px;
        color: var(--text-dim);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
    }
    .order-details-banner b { color: var(--text); font-weight: 600; }

    .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg-row { display: flex; max-width: 70%; }
    .msg-row.from-dev { align-self: flex-end; justify-content: flex-end; }
    .msg-row.from-client { align-self: flex-start; }
    .msg-row.from-system { align-self: center; max-width: 90%; }
    .bubble {
        padding: 9px 13px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
    }
    .from-dev .bubble { background: var(--grad); color: #fff; border-bottom-right-radius: 4px; }
    .from-client .bubble { background: var(--glass-strong); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
    .from-system .bubble { background: transparent; color: var(--text-faint); font-size: 12px; text-align: center; padding: 4px 10px; }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.65); margin-top: 3px; text-align: right; }
    .from-client .msg-time { color: var(--text-faint); text-align: left; }

    .chat-input-bar {
        display: flex;
        gap: 10px;
        padding: 12px 20px;
        border-top: 1px solid var(--glass-border);
    }
    .chat-input-bar textarea {
        flex: 1;
        resize: none;
        max-height: 120px;
        min-height: 42px;
        padding: 10px 14px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
    }
    .chat-input-bar textarea:focus { border-color: var(--glass-border-strong); }
    .send-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        background: var(--grad);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform var(--transition);
    }
    .send-btn:hover { transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @media(max-width: 800px) {
        .panel-wrap { flex-direction: column; }
        .sidebar {
            width: 100%;
            height: 40%;
            border-right: none;
            border-bottom: 1px solid var(--glass-border);
        }
        .chat-area { height: 60%; }
        .msg-row { max-width: 85%; }
    }
</style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <h1>Developer Panel</h1>
            <p>Sign in to view and reply to client requests.</p>
            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" autocomplete="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password">
            </div>
            <button class="login-btn" id="loginBtn">Sign In</button>
            <div class="login-error" id="loginError">Incorrect email or password.</div>
        </div>
    </div>

    <div id="appShell">
        <div class="panel-wrap">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Orders</h2>
                    <button class="logout-btn" id="logoutBtn">Sign Out</button>
                </div>
                <div class="order-list" id="orderList">
                    <div class="empty-orders">Loading orders...</div>
                </div>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="chat-placeholder">Select an order from the list to open its chat.</div>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        function waitForFirebase() {
            return new Promise(resolve => {
                if (window.FB) { resolve(window.FB); return; }
                window.addEventListener('firebase-ready', () => resolve(window.FB), { once: true });
            });
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let FB = null;
        let currentOrderId = null;
        let unsubMessages = null;
        let ordersCache = {};

        async function boot() {
            FB = await waitForFirebase();

            FB.onAuthStateChanged(FB.auth, user => {
                if (user) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appShell').style.display = 'block';
                    loadOrders();
                } else {
                    document.getElementById('loginScreen').style.display = 'flex';
                    document.getElementById('appShell').style.display = 'none';
                }
            });

            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('loginPassword').addEventListener('keydown', e => {
                if (e.key === 'Enter') doLogin();
            });
            document.getElementById('logoutBtn').addEventListener('click', () => {
                FB.signOut(FB.auth);
            });
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            errBox.style.display = 'none';

            if (!email || !password) return;

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            try {
                await FB.signInWithEmailAndPassword(FB.auth, email, password);
            } catch (err) {
                console.error('Login failed:', err);
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        function loadOrders() {
            const ordersRef = FB.collection(FB.db, 'orders');
            const q = FB.query(ordersRef, FB.orderBy('createdAt', 'desc'));

            FB.onSnapshot(q, snapshot => {
                const list = document.getElementById('orderList');
                if (snapshot.empty) {
                    list.innerHTML = '<div class="empty-orders">No orders yet.</div>';
                    return;
                }
                list.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    ordersCache[docSnap.id] = order;
                    const item = document.createElement('div');
                    item.className = 'order-item' + (docSnap.id === currentOrderId ? ' active' : '');
                    const status = order.status || 'new';
                    item.innerHTML = `
                        <div class="order-item-top">
                            <span class="order-item-name">${escapeHtml(order.name || 'Unknown')}</span>
                            <span class="order-item-badge ${status}">${status.replace('_',' ')}</span>
                        </div>
                        <div class="order-item-sub">${escapeHtml(order.packageName || '')} · ${escapeHtml(order.priceLabel || '')}</div>
                    `;
                    item.addEventListener('click', () => openOrder(docSnap.id));
                    list.appendChild(item);
                });
            });
        }

        function openOrder(orderId) {
            currentOrderId = orderId;
            document.querySelectorAll('.order-item').forEach(el => el.classList.remove('active'));
            loadOrders();

            const order = ordersCache[orderId];
            const chatArea = document.getElementById('chatArea');

            chatArea.innerHTML = `
                <div class="chat-header">
                    <div>
                        <div class="cust-name">${escapeHtml(order.name || 'Unknown')}</div>
                        <div class="cust-meta">${escapeHtml(order.phone || '')}${order.email ? ' · ' + escapeHtml(order.email) : ''}</div>
                    </div>
                    <select class="status-select" id="statusSelect">
                        <option value="new">New</option>
                        <option value="in_progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="order-details-banner">
                    <span>Package: <b>${escapeHtml(order.packageName || '-')}</b></span>
                    <span>Price: <b>${escapeHtml(order.priceLabel || '-')}</b></span>
                    ${order.details ? `<span>Details: <b>${escapeHtml(order.details)}</b></span>` : ''}
                </div>
                <div class="chat-body" id="chatBody"></div>
                <div class="chat-input-bar">
                    <textarea id="devMsgInput" rows="1" placeholder="Type a reply..."></textarea>
                    <button class="send-btn" id="devSendBtn" aria-label="Send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            `;

            const statusSelect = document.getElementById('statusSelect');
            statusSelect.value = order.status || 'new';
            statusSelect.addEventListener('change', async () => {
                await FB.updateDoc(FB.doc(FB.db, 'orders', orderId), { status: statusSelect.value });
            });

            if (unsubMessages) unsubMessages();

            const chatBody = document.getElementById('chatBody');
            const messagesRef = FB.collection(FB.db, 'orders', orderId, 'messages');
            const q = FB.query(messagesRef, FB.orderBy('createdAt', 'asc'));

            unsubMessages = FB.onSnapshot(q, snapshot => {
                chatBody.innerHTML = '';
                snapshot.forEach(docSnap => appendMessage(chatBody, docSnap.data()));
                chatBody.scrollTop = chatBody.scrollHeight;
            });

            const devMsgInput = document.getElementById('devMsgInput');
            const devSendBtn = document.getElementById('devSendBtn');

            async function sendDevMessage() {
                const text = devMsgInput.value.trim();
                if (!text) return;
                devSendBtn.disabled = true;
                devMsgInput.value = '';
                devMsgInput.style.height = 'auto';
                try {
                    await FB.addDoc(messagesRef, {
                        sender: 'dev',
                        text,
                        createdAt: FB.serverTimestamp()
                    });
                } catch (err) {
                    console.error('Failed to send message:', err);
                    alert('Message failed to send. Please try again.');
                } finally {
                    devSendBtn.disabled = false;
                    devMsgInput.focus();
                }
            }

            devSendBtn.addEventListener('click', sendDevMessage);
            devMsgInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendDevMessage();
                }
            });
            devMsgInput.addEventListener('input', () => {
                devMsgInput.style.height = 'auto';
                devMsgInput.style.height = Math.min(devMsgInput.scrollHeight, 120) + 'px';
            });
        }

        function appendMessage(container, msg) {
            const row = document.createElement('div');
            const sender = msg.sender === 'dev' ? 'from-dev' : (msg.sender === 'system' ? 'from-system' : 'from-client');
            row.className = `msg-row ${sender}`;
            const time = formatTime(msg.createdAt);
            row.innerHTML = `
                <div>
                    <div class="bubble">${escapeHtml(msg.text || '')}</div>
                    ${time && msg.sender !== 'system' ? `<div class="msg-time">${time}</div>` : ''}
                </div>
            `;
            container.appendChild(row);
        }

        boot();
    </script>
</body>
</html>
