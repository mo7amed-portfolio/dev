<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chat with Developer — Mohamed Ashraf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
        --bg: #0B0E14;
        --bg-2: #0E1220;
        --glass: rgba(255, 255, 255, 0.045);
        --glass-strong: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-border-strong: rgba(255, 255, 255, 0.2);
        --text: #F5F7FA;
        --text-dim: #9AA3B5;
        --text-faint: #6B7385;
        --accent-1: #5B8CFF;
        --accent-2: #9D6BFF;
        --accent-3: #34D399;
        --grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 12px;
        --font-ar: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
        --font-en: 'Space Grotesk', 'Inter', sans-serif;
        --transition: 0.25s ease;
    }
    body {
        background: var(--bg);
        background-image:
            radial-gradient(circle at 15% 10%, rgba(91, 140, 255, 0.10), transparent 45%),
            radial-gradient(circle at 85% 90%, rgba(157, 107, 255, 0.10), transparent 45%);
        font-family: var(--font-en);
        color: var(--text);
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: rgba(11, 14, 20, 0.85);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--glass-border);
    }
    .chat-header .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--grad);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
    }
    .chat-header .info {
        flex: 1;
        min-width: 0;
    }
    .chat-header .name {
        font-weight: 600;
        font-size: 15px;
    }
    .chat-header .status {
        font-size: 12px;
        color: var(--accent-3);
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .chat-header .status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-3);
        box-shadow: 0 0 6px var(--accent-3);
    }
    .chat-header .back {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        text-decoration: none;
        flex-shrink: 0;
    }

    .order-banner {
        margin: 12px 16px 0;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        font-size: 12.5px;
        color: var(--text-dim);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
    }
    .order-banner b { color: var(--text); font-weight: 600; }

    .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
    }

    .msg-row {
        display: flex;
        max-width: 82%;
    }
    .msg-row.from-client {
        align-self: flex-end;
        justify-content: flex-end;
    }
    .msg-row.from-dev {
        align-self: flex-start;
    }
    .msg-row.from-system {
        align-self: center;
        max-width: 90%;
    }
    .bubble {
        padding: 9px 13px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
    }
    .from-client .bubble {
        background: var(--grad);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .from-dev .bubble {
        background: var(--glass-strong);
        border: 1px solid var(--glass-border);
        border-bottom-left-radius: 4px;
    }
    .from-system .bubble {
        background: transparent;
        color: var(--text-faint);
        font-size: 12px;
        text-align: center;
        padding: 4px 10px;
    }
    .msg-time {
        font-size: 10px;
        color: rgba(255,255,255,0.65);
        margin-top: 3px;
        text-align: right;
    }
    .from-dev .msg-time {
        color: var(--text-faint);
        text-align: left;
    }

    .empty-state {
        margin: auto;
        text-align: center;
        color: var(--text-faint);
        font-size: 13px;
        padding: 40px 20px;
    }

    .chat-input-bar {
        position: sticky;
        bottom: 0;
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        background: rgba(11, 14, 20, 0.85);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--glass-border);
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
    }
    .chat-input-bar textarea {
        flex: 1;
        resize: none;
        max-height: 120px;
        min-height: 42px;
        padding: 10px 14px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
    }
    .chat-input-bar textarea:focus {
        border-color: var(--glass-border-strong);
    }
    .send-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        background: var(--grad);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform var(--transition);
    }
    .send-btn:hover { transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-screen {
        margin: auto;
        text-align: center;
        padding: 40px 24px;
        max-width: 420px;
    }
    .error-screen h2 { font-size: 18px; margin-bottom: 8px; }
    .error-screen p { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; }

    @media(max-width: 480px) {
        .chat-header .name { font-size: 14px; }
        .msg-row { max-width: 88%; }
    }
</style>
</head>
<body>

    <div class="chat-header">
        <a href="index.html" class="back" aria-label="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="avatar">M</div>
        <div class="info">
            <div class="name">Mohamed Ashraf</div>
            <div class="status"><span class="dot"></span>Developer</div>
        </div>
    </div>

    <div class="order-banner" id="orderBanner" style="display:none;"></div>

    <div class="chat-body" id="chatBody">
        <div class="empty-state" id="loadingState">Loading conversation...</div>
    </div>

    <div class="chat-input-bar" id="inputBar" style="display:none;">
        <textarea id="msgInput" rows="1" placeholder="Type a message..."></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        function getOrderId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('order');
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function waitForFirebase() {
            return new Promise(resolve => {
                if (window.FB) { resolve(window.FB); return; }
                window.addEventListener('firebase-ready', () => resolve(window.FB), { once: true });
            });
        }

        function showError(title, sub) {
            document.getElementById('chatBody').innerHTML =
                `<div class="error-screen"><h2>${title}</h2><p>${sub}</p></div>`;
        }

        function renderBanner(order) {
            const banner = document.getElementById('orderBanner');
            banner.style.display = 'flex';
            banner.innerHTML = `
                <span>Package: <b>${order.packageName || '-'}</b></span>
                <span>Price: <b>${order.priceLabel || '-'}</b></span>
            `;
        }

        function appendMessage(container, msg) {
            const row = document.createElement('div');
            const sender = msg.sender === 'dev' ? 'from-dev' : (msg.sender === 'system' ? 'from-system' : 'from-client');
            row.className = `msg-row ${sender}`;
            const time = formatTime(msg.createdAt);
            row.innerHTML = `
                <div>
                    <div class="bubble">${escapeHtml(msg.text || '')}</div>
                    ${time && msg.sender !== 'system' ? `<div class="msg-time">${time}</div>` : ''}
                </div>
            `;
            container.appendChild(row);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function init() {
            const orderId = getOrderId();
            if (!orderId) {
                showError('No order found', 'This chat link is missing an order reference. Please submit a request from the main page first.');
                return;
            }

            const FB = await waitForFirebase();
            const orderDocRef = FB.doc(FB.db, 'orders', orderId);
            const orderSnap = await FB.getDoc(orderDocRef);

            if (!orderSnap.exists()) {
                showError('Order not found', 'We could not find this order. It may have been removed, or the link is incorrect.');
                return;
            }

            renderBanner(orderSnap.data());

            const chatBody = document.getElementById('chatBody');
            const inputBar = document.getElementById('inputBar');
            const msgInput = document.getElementById('msgInput');
            const sendBtn = document.getElementById('sendBtn');

            chatBody.innerHTML = '';
            inputBar.style.display = 'flex';

            const messagesRef = FB.collection(FB.db, 'orders', orderId, 'messages');
            const q = FB.query(messagesRef, FB.orderBy('createdAt', 'asc'));

            let firstLoad = true;
            FB.onSnapshot(q, snapshot => {
                chatBody.innerHTML = '';
                if (snapshot.empty) {
                    chatBody.innerHTML = '<div class="empty-state">No messages yet. Say hello!</div>';
                } else {
                    snapshot.forEach(docSnap => appendMessage(chatBody, docSnap.data()));
                    if (firstLoad) {
                        chatBody.scrollTop = chatBody.scrollHeight;
                        firstLoad = false;
                    } else {
                        chatBody.scrollTop = chatBody.scrollHeight;
                    }
                }
            });

            async function sendMessage() {
                const text = msgInput.value.trim();
                if (!text) return;
                sendBtn.disabled = true;
                msgInput.value = '';
                msgInput.style.height = 'auto';
                try {
                    await FB.addDoc(messagesRef, {
                        sender: 'client',
                        text,
                        createdAt: FB.serverTimestamp()
                    });
                } catch (err) {
                    console.error('Failed to send message:', err);
                    alert('Message failed to send. Please try again.');
                } finally {
                    sendBtn.disabled = false;
                    msgInput.focus();
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            msgInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            msgInput.addEventListener('input', () => {
                msgInput.style.height = 'auto';
                msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
            });
        }

        init();
    </script>
</body>
</html>
